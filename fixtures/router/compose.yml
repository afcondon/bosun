# The SDI replacement, DOGFOODED: `bosun serve` (the typed lazy-spawn router)
# run as a SUPERVISED PROCESS under `bosun supervise`. The point is portability,
# not self-hosting vanity: Bosun's own process executor is the lowest-common-
# denominator supervisor — it needs only spawn-a-process, is-the-pgid-alive, and
# probe — primitives that exist on EVERY target PureScript compiles to. So the
# SAME mechanism keeps the router alive on macOS now, Linux later, and a
# hypothetical bare PureScript computing surface that has no launchd/systemd/
# docker at all. Bosun brings its own supervisor; the host need not supply one.
services:
  bosun-serve:
    x-bosun:
      host: mbp
      # NO probe: process — see the chair-frontend note below. serve binds a TCP
      # port (/state on :3997), so exposing it and omitting `probe` gives
      # TcpConnect readiness (Observe.purs: NoProbe + HostPort ⇒ TcpConnect).
      # `probe: process` here was the "deliberate v1 simplification" and it cost
      # 54,444 reconciles and a 43 MB log between 25 and 31 Jul 2026: the pgid
      # apply recorded went stale, every relaunch hit EADDRINUSE from the
      # untracked survivor, and nothing ever noticed. A port probe adopts the
      # survivor instead of fighting it.
      process:
        cwd: ${BOSUN_ROOT}
        # a PREBUILT artifact, not a build-and-run wrapper (run.js loads the
        # compiled output). Reads the GIT-TRACKED registry/fleet.json — Bosun's
        # source of truth for the dev-server fleet (see docs/PORT-MODEL.md). This
        # drops the router's runtime dependency on Marginalia being up; Marginalia's
        # /api/ports is now a non-authoritative mirror. The backend-go binary swaps
        # in here later with zero model change.
        command: node cli/run.js serve ${BOSUN_ROOT}/registry/fleet.json
      expose:
        - host: 3997

  # Bosun's Chair (#236) — the operational surface and registry-edit cockpit.
  # Always-up under supervise rather than lazy-spawned, because (a) Chair is THE
  # dashboard you want running whenever Bosun is, and (b) chair-server is about
  # to grow the write API for fleet.json — supervised lifecycle keeps the SoT
  # editor reachable without a cold-start race on first POST.
  chair-server:
    x-bosun:
      host: mbp
      # NO probe: process — TCP readiness on the exposed :3022 below.
      process:
        cwd: ${BOSUN_ROOT}
        # Read-only analysis backend (POST /analyze runs the loose→tight ladder).
        # The fleet.json write API (POST /api/servers, GET /api/ports/suggest)
        # lands here next — chair-server is the registry-mutation host.
        command: BOSUN_CHAIR_SERVER_PORT=3022 node chair-server/run.js
      expose:
        - host: 3022

  chair-frontend:
    depends_on:
      - bosun-serve
      - chair-server
    x-bosun:
      host: mbp
      # NO probe: process here — this is an HTTP server, so omit it to get the
      # default TCP-to-port readiness on 3020. `probe: process` + the old `npx
      # http-server` command was a 1500-restart flap: npx forks the real server
      # as a GRANDCHILD, so the recorded pgid misread as dead → the supervisor
      # relaunched → the relaunch hit EADDRINUSE (the orphaned original still
      # held :3020) → crash → repeat. Fixed by (a) TCP probe + (b) a single-
      # process command below (stable pgid, no npx wrapper).
      process:
        cwd: ${BOSUN_ROOT}/chair
        # Halogen SPA — index.html + app.js + assets, served single-process.
        # The in-page JS talks to bosun-serve :3997 + chair-server :3022 cross-
        # origin (those set CORS), so the static host needs no --cors of its own.
        command: python3 -m http.server 3020 --bind 127.0.0.1
      expose:
        - host: 3020

  # The supervisor-of-supervisors edge (2026-07-21). This launchd-rooted
  # group is the ONE host bootstrap; making it supervise OTHER groups'
  # supervisors keeps the whole tree alive off a single hook — the portable
  # answer to "no per-service launchd". First sub-group: Brunel (the
  # operations-cartography stratum, minard-for-nix its first member). A
  # supervised process that is itself a `bosun supervise` — the same
  # dogfooding as bosun-serve above. Extend with atlantis-/polyglot-
  # supervisor members to give those groups reboot-persistence too.
  brunel-supervisor:
    x-bosun:
      host: mbp
      # NO probe: process — TCP readiness on the exposed :3993 below. Under the
      # pgid probe this layered rather than replaced: a relaunched supervisor
      # whose :3993 is already held does NOT exit (unlike serve/chair-server), so
      # the stale-pgid relaunch left a second, permanently blind supervisor
      # double-owning the group. A port probe reads the incumbent as up.
      process:
        cwd: ${BOSUN_ROOT}
        command: node cli/run.js supervise --port 3993 ${BOSUN_ROOT}/fixtures/brunel/compose.yml ${BOSUN_ROOT}/fixtures/brunel/registry.json
      expose:
        - host: 3993

  # The live-coding rig, folded under the single root (2026-07-21). Was a
  # standalone ad-hoc `bosun supervise --port 3994`; now the launchd root
  # owns it, so it survives reboot with everything else. A fresh supervisor
  # has no in-process pgid memory, so the cutover down'd the ad-hoc group
  # and let this one bring the rig up clean.
  atlantis-supervisor:
    x-bosun:
      host: mbp
      # NO probe: process — TCP readiness on the exposed :3994 below (same
      # layering failure as brunel-supervisor above).
      process:
        cwd: ${BOSUN_ROOT}
        command: node cli/run.js supervise --port 3994 ${BOSUN_ROOT}/fixtures/atlantis/compose.yml ${BOSUN_ROOT}/fixtures/atlantis/registry.json
      expose:
        - host: 3994

  minard-supervisor:
    # The code-cartography group (API :3000 + frontend :3010). Joined 2026-09-10
    # so Minard is demo-ready without a `make start` — see
    # fixtures/minard/compose.yml for why a group rather than a serve route.
    x-bosun:
      host: mbp
      # NO probe: process — TCP readiness on the exposed :3992, as above.
      process:
        cwd: ${BOSUN_ROOT}
        command: node cli/run.js supervise --port 3992 ${BOSUN_ROOT}/fixtures/minard/compose.yml ${BOSUN_ROOT}/fixtures/minard/registry.json
      expose:
        - host: 3992
