# The REAL polyglot `core` profile (edge + website), lifted verbatim from
# polyglot-deploy/docker-compose.yml — the minimal public baseline: the
# Scuppered Ligature edge router on :80 fronting the Polyglot website.
#
# Both services have no x-bosun.host, so the Compose adapter places them on the
# default deploy target (macmini) as Container facets. `bosun apply --dry-run`
# therefore emits ssh-wrapped `docker compose up -d` in boot order
# (website → edge, since edge depends_on website).
#
# This is the Stage-1 delta #2 fixture: model the core profile as a macmini
# container deployment, dry-run it (zero outward effect), then live-fire.
services:
  edge:
    profiles: ["core", "minard", "tidal", "hypo", "sankey", "wasm", "libs", "showcases", "full"]
    build:
      context: ../purescript-hylograph-showcases/scuppered-ligature
      dockerfile: docker/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - website
    networks:
      - polyglot
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/edge/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  website:
    profiles: ["core", "minard", "tidal", "hypo", "sankey", "wasm", "libs", "showcases", "full"]
    build:
      context: ../purescript-polyglot/site/website
    networks:
      - polyglot
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
