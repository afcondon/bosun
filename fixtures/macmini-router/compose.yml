# The MacMini's root group — what its launchd `bosun supervise` keeps alive.
#
# Replaces the untracked mini-side fixtures/router/ that federation phase 1a
# (2026-06-24) left in a hand-copied, non-git ~/work/bosun on the mini. Moving
# it into the repo is what lets the mini run a real checkout.
#
# chair-frontend is gone. The standalone Chair was deprecated on 2026-07-22
# (chair/DEPRECATED.md) in favour of Brunel's Chair tab, and the mini was still
# serving a June-19 bundle of it on :3020 that nothing linked to. Brunel's
# machine picker (minard-for-nix/docs/chair-machine-selection.md) keeps
# chair-server local to wherever Brunel runs, so nothing needs a Chair frontend
# on this box.
#
# chair-server stays for now as the group's one member. It keeps the
# launchd → supervise chain exercised until phase 1b folds the mini's
# production plists (marginalia, infovore, whisper) in here, and bosun-serve
# joins once registry/fleet.json is carved by host. See
# docs/kb/plans/two-machine-infrastructure.md.
services:
  chair-server:
    x-bosun:
      host: macmini
      # NO probe: process — TCP readiness on :3022, for the reason given in
      # fixtures/router/compose.yml (a stale pgid relaunches into EADDRINUSE).
      process:
        cwd: ${BOSUN_ROOT}
        command: BOSUN_CHAIR_SERVER_PORT=3022 node chair-server/run.js
      expose:
        - host: 3022

  infovore:
    x-bosun:
      host: macmini
      # Moved from launchd (net.hylograph.infovore, now disabled) 2026-09-26.
      # TCP readiness on the exposed :8090; the port is a literal flag.
      process:
        cwd: /Users/andrew/work/afc-work/infovore-larder-db
        command: ./.venv/bin/python3 tools/webapp/server.py --host 0.0.0.0 --port 8090
      expose:
        - host: 8090

  marginalia-whisper:
    x-bosun:
      host: macmini
      # Moved from launchd (net.hylograph.marginalia.whisper, now disabled)
      # 2026-09-26. whisper-server.py loads the model BEFORE it binds :3200, so TCP
      # readiness really does mean "can transcribe" (rule 4 holds as written).
      # The venv's python is called directly instead of sourcing activate.
      process:
        cwd: /Users/andrew/work/marginalia-demo/project-tracker
        command: tools/whisper-venv/bin/python3 tools/whisper-server.py --port 3200
      expose:
        - host: 3200

  marginalia-api:
    x-bosun:
      host: macmini
      # RULE 1 GAP: the port is hardcoded (`serve { port: 3100 }` in
      # server/src/Main.purs), so the 3100 below is a statement, not a setting;
      # Bosun cannot relocate it. Fine for a fixed production port; fix in
      # Marginalia if it ever has to move.
      # RULE 3: the per-clone .env the launchd wrapper sources is carried as
      # typed env instead. Values copied from the Mini's .env on 2026-09-26.
      # DuckDB is single-writer: never let a second instance start (the
      # launchd agent must be booted out first, step 2 above).
      # UNKNOWN: whether it closes DuckDB cleanly on SIGTERM (rule 5). Check
      # the log after the first `/control/restart`.
      # Moved from launchd (net.hylograph.marginalia.api, now disabled)
      # 2026-09-26. KNOWN, NOT BOSUN'S: uploads write straight to the volume
      # (server/src/API/Agent.js), and the only Removable Volumes grant is
      # for an nvm node that no longer exists, so uploads have probably failed
      # since the nvm→Nix switch. See the two-machine plan, Phase 2.
      process:
        cwd: /Users/andrew/work/marginalia-demo/project-tracker
        command: node server/run.js
        env:
          MARGINALIA_ATTACHMENT_STORE: "/Volumes/Crucial4TB/Documents/Notes Attachments/"
          MARGINALIA_ATTACHMENTS_PROXY: "http://127.0.0.1:8091/marginalia-attachments"
      expose:
        - host: 3100
