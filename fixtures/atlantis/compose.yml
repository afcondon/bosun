# Atlantis — the live-coding rig's OS-process tier, modelled for Bosun to
# supervise in place of DeepStar (ROADMAP Stage 2). These are NATIVE processes,
# not containers, so each declares `x-bosun.process {cwd, command}` (the compose
# adapter reads that as a Process executor). `depends_on` gives the boot DAG;
# `x-bosun.expose` the reachability. Source of truth for the set + deps: the
# DeepStar SPEC's service table (es9-daemon was cv-router; fh2-daemon ×N).
#
# Boot order falls out of depends_on:
#   stage 0: es9-daemon, link-spike, fh2-daemon   (no deps)
#   stage 1: purerl-tidal        (needs es9-daemon + link-spike)
#   stage 2: calypso-server      (needs purerl-tidal)
#   stage 3: calypso-frontend    (needs calypso-server)
#
# NB the OSC ports are UDP; the Address model has no protocol axis yet, so they
# ride as plain listening ports — the UDP/process-existence probe is Stage-2
# delta #1 (today's TCP-connect probe would mis-read them).
# The rig runs LOCALLY (the machine with the ES-9/FH-2 hardware), so every
# service is x-bosun.host: mbp → LocalExec (no ssh-wrap). Adjust the host if the
# rig moves; this is the one placement assumption to confirm in the #134-style
# co-design.
services:
  es9-daemon:
    # INSTRUMENT TIER (docs/WHO-SPAWNS-WHAT.md): it opens the ES-9 over
    # CoreAudio and binds one UDP port, so at most one may run, and a copy that
    # loses the bind is not a copy that will win it later.
    #
    # `probe: exec` rather than `process`, because `process` asks "is the group
    # I recorded alive" and this daemon is routinely started by hand or by
    # `deepstar up`. On 2026-09-10 the real one had held udp:57130 on pid 1596
    # for eight hours while this supervisor read Down and spawned a loser 1,335
    # times. The check tests the ENDPOINT DECLARED TWO LINES BELOW, so it cannot
    # drift the way a check naming another file's service id could.
    restart: on-failure
    x-bosun:
      host: mbp
      probe: exec
      check: lsof -t -iUDP:57130
      restart:
        minSec: 30
        maxRetries: 10
      process:
        cwd: /Users/afc/work/afc-work/music/expert-sleepers/es9-daemon
        command: ./target/release/es9-daemon
      expose:
        # OSC listen port moved 57120 -> 57130 (purerl-tidal workstream C) so a
        # real SuperDirt can use the conventional Dirt port 57120.
        - host: 57130

  link-spike:
    # Instrument tier: one UDP bind, and it joins an Ableton Link session — two
    # of these would be two peers claiming to be this machine.
    restart: on-failure
    x-bosun:
      host: mbp
      probe: exec
      check: lsof -t -iUDP:57122
      restart:
        minSec: 30
        maxRetries: 10
      process:
        cwd: /Users/afc/work/afc-work/music/link-spike
        command: ./target/release/link-spike
      expose:
        - host: 57122

  purerl-tidal:
    depends_on:
      - es9-daemon
      - link-spike
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/purerl-tidal
        command: erl -pa ebin -noshell -eval 'F = main@ps:main(), F()'
        # ERL_LIBS puts the rebar3 deps (cowboy & co) on the BEAM code path —
        # `erl -pa ebin` alone misses cowboy.app and the boot crashes. Typed
        # launch env (DeepStar carried it as a per-service [service.env]); bosun
        # renders it as a leading `ERL_LIBS=… ` assignment that its `nohup env
        # <command>` wrapper applies. Irreducible launch knowledge (rebar3's
        # layout) — typed data, not buried in the command string.
        env:
          ERL_LIBS: _build/default/lib
      expose:
        - host: 3012

  calypso-server:
    depends_on:
      - purerl-tidal
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/calypso
        command: BACKEND_PORT=3060 node server/run.js
      expose:
        - host: 3060

  calypso-frontend:
    depends_on:
      - calypso-server
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/calypso
        command: npx http-server frontend/public -p 3061 -c-1 --cors
      expose:
        - host: 3061

  triggerfish-frontend:
    # The Triggerfish instrument suite (Halogen: Odonus/Balistes/Sufflamen/
    # Stellatus + Vetula). A rig WS client of purerl-tidal :3012 (Binnacle
    # transport + Stellatus scene push), so it sits at stage 2 like calypso-server.
    # Static public/ (bundle.js + samples/) served by the PREBUILT static-httpd Go
    # binary — the AC-blessed prebuilt-artifact static server (no python/npx as a
    # runtime dep; cf polyglot-deploy/static-httpd). Port 3023 allocated by the
    # Marginalia registry (server #154); replaces the ad-hoc `python -m http.server
    # 4321` that was serving it outside the infrastructure.
    depends_on:
      - purerl-tidal
    x-bosun:
      host: mbp
      # NO probe: process — this is a TCP HTTP server, so the exposed :3023 gives
      # TcpConnect readiness. (The OSC/UDP members above KEEP probe: process — a
      # TCP probe mis-reads a UDP socket. The distinction is protocol, not taste.)
      process:
        cwd: /Users/afc/work/afc-work/polyglot/polyglot-deploy/static-httpd
        command: ./static-httpd -port 3023 -root /Users/afc/work/afc-work/music/live-coding/triggerfish/public
      expose:
        - host: 3023

  superdirt:
    # The rig's sample-playback sound engine (SuperCollider + SuperDirt). Stage 0
    # — no deps; it just binds UDP and waits for /dirt/play. The SHIPPING path is
    # BEAM-authoritative: purerl-tidal (and its reef_stellatus voice) emits
    # /dirt/play straight here, so this is permanent rig infrastructure, not a
    # dev crutch. It listens on the conventional Dirt port 57120 — the reason
    # es9-daemon's OSC moved to 57130 above. boot-superdirt.sh runs headless
    # sclang in its own process group and drains the scsynth child on TERM (the
    # pgid teardown Bosun's process executor should model) — it now WAITS for the
    # tree to actually die and escalates to KILL, because sclang segfaults rather
    # than draining when memory is tight, and the old fire-and-exit teardown left
    # ~1 GB of orphaned scsynth behind on every such attempt. SUPERDIRT_PORT is
    # port-from-env per the bosun-daemon skill.
    #
    # Launched via the CORE wrapper: superdirt-core.sh loads ~9 MB of sample
    # banks instead of all 217 Dirt-Samples (~935 MB of scsynth footprint, which
    # was this rig's single largest memory holder). The sibling superdirt-full.sh
    # is the sound-hunting path — not what a supervised rig should hold open.
    #
    # NB the browser-side `stellatus-bridge.mjs` (HTTP→UDP relay) is a DEV-AUDITION
    # crutch only — it exists because a browser can't send UDP, and it disappears
    # once the BEAM path lands. It is deliberately NOT modelled here.
    #
    # `probe: exec` on the port sclang actually binds, rather than `process`.
    # The recorded process group is boot-superdirt.sh's; sclang runs in its OWN
    # group (deliberately — that is how the drain works), so the process probe
    # was reading the WRAPPER. sclang segfaults rather than draining when memory
    # is tight, and a segfaulted sclang under a live wrapper reads Running over
    # complete silence. `lsof -t -iUDP:57120` reads the thing that receives
    # /dirt/play, which is the only fact that matters.
    #
    # Capped, because uncapped is measured: on 2026-08-31 the MBP was unplugged
    # from the ES-9 overnight, es9/fh2/link failed for ten hours, `fails`
    # reached ~8,200 and the backoff exponent overflowed the stack, so the tick
    # never converged and every reconcile relaunched all eleven services —
    # 6,309 SuperCollider boots and ~1 GB of orphaned scsynth. The exponent
    # clamp fixed the overflow; this stops the boots even if something else ever
    # wedges the loop. A SuperDirt that will not boot on the tenth try will not
    # boot on the six-thousandth.
    restart: on-failure
    x-bosun:
      host: mbp
      probe: exec
      check: lsof -t -iUDP:57120
      restart:
        minSec: 30
        maxRetries: 10
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/triggerfish
        command: ./audio/superdirt-core.sh
        env:
          SUPERDIRT_PORT: "57120"
          # scsynth output device — BlackHole 2ch, so Ableton captures the stereo
          # pair. The space is safe: Bosun now shell-quotes env values (project 227
          # note #398, landed 2026-07-07). boot-superdirt.sh keeps a `:-BlackHole 2ch`
          # fallback for manual/standalone launches; this is the supervised value.
          SUPERDIRT_DEVICE: "BlackHole 2ch"
      expose:
        - host: 57120

  amphora:
    # The Atlantis artefact store — a content-addressed DuckDB library the
    # browser editors read/write over HTTP (Balistes' genre-starter pattern
    # library is the first client; Odonus scenes + the scale universe follow).
    # Stage 0 (no deps): it binds :3024 and serves. The FIRST STATEFUL member of
    # the group — a DuckDB file under db/ — so it's the real test of Bosun
    # supervising a service with persistent state (rule 5: process exit releases
    # the DuckDB lock, so a restart re-acquires cleanly; verified by kill+restart).
    # Prebuilt artifact: `spago build` once, then `node run.js` (the toolchain-
    # free runner that imports compiled output/Amphora.Main — like calypso/fh2).
    # Port embedded literally in the command (rule 1); the DB path is cwd-relative.
    # No depends_on and nothing depends on it: the frontend fetches at runtime and
    # falls back to bundled patterns if the store is down, so boot never blocks on
    # it. Default TCP-to-port readiness on 3024. Marginalia registry server #155.
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/amphora
        command: AMPHORA_PORT=3024 node run.js
      expose:
        - host: 3024

  friends-of-itajara:
    # Friends of Itajara (Marginalia #287, music/friends-of-itajara): the
    # open-source looper page on the Itajara daemon, one face per module. Its
    # server.mjs (Node, zero deps) serves the page and holds the two things a
    # browser cannot do — write a take's notes.json and run `msm harvest` onto
    # a stick. Stage 0: the page finds the daemon itself over ws://:3028 (the
    # `bosun serve` broker lazy-spawns itajara on first connect) and reconnects
    # for ever, so nothing here depends on the daemon being up first, and
    # supervising the page does not imply supervising the engine. TCP HTTP on
    # :3029 → default TcpConnect readiness. Port-from-env (PORT), prebuilt
    # static/index.js (`make bundle` once), drains on TERM — the bosun-daemon
    # contract. msm must be on the PATH (~/.cargo/bin) for Harvest to work.
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/friends-of-itajara
        command: PORT=3029 node server.mjs
        # msm lives in ~/.cargo/bin, which a supervisor's PATH does not have.
        env:
          PATH: /Users/afc/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin
      expose:
        - host: 3029

  deepstar:
    # THE RIG DOCTOR, finally a member (Marginalia 191). `deepstar serve` is an
    # HTTP API on :3027 — the house pattern (Marginalia :3100, the Chair :3022,
    # Calypso :3060, Amphora :3024): one backend a human curls, an agent calls
    # and a web surface renders, with one implementation behind all three.
    #
    # It was missing from this file for a reason worth writing down rather than
    # quietly fixing: DeepStar is mostly a COMMAND, not a daemon, and "why is
    # deepstar not supervised" is half a category error. But `serve` genuinely
    # is a daemon, and it is the one Quadrat needs — the calibration runner
    # (`tune`, `sweep`, `latency`) lives behind it, and the pitch-calibration
    # work in docs/kb/plans/sample-sets.md shells out to exactly this.
    #
    # Stage 0: it binds and waits. Its rig lock means at most one may run, which
    # its own :3027 bind already enforces — a TCP probe is adoption-capable by
    # construction (it asks "is something listening", never "did I start it"),
    # so no exec check is needed here. That is the whole reason the TCP services
    # in this file have never storm-restarted and the process-probed ones have.
    #
    # It does NOT supervise anything and must not: supervision was ceded to
    # Bosun on 2026-07-02, and `deepstar up` survives as the zero-infrastructure
    # launcher for an Atlantis running on someone else's machine. See
    # docs/WHO-SPAWNS-WHAT.md.
    x-bosun:
      host: mbp
      process:
        cwd: /Users/afc/work/afc-work/music/live-coding/deepstar
        command: ./bin/deepstar serve --port 3027
      expose:
        - host: 3027

  fh2-daemon:
    # Instrument tier, and the service that paid for this whole seam. With the
    # FH-2 powered off, `run-daemon.mjs` prints "FH-2 MIDI port not found" and
    # exits — with status ZERO, so no exit-code policy in the world would have
    # caught it. It was relaunched 2,912 times in seven days. The RETRY CAP is
    # what stops that, and five tries a half-minute apart is plenty to
    # distinguish "still booting" from "the module is off".
    #
    # Giving up is reported (`gaveUp` in /state) and recoverable: power the
    # module on and POST /control/restart?service=fh2-daemon, which clears the
    # fail count and hands back the full budget.
    #
    # The check tests the socket by OPEN FD, not by existence: a stale socket
    # file outlives a crashed daemon (DeepStar SPEC failure A7), and `test -S`
    # would read the corpse as a live service.
    restart: on-failure
    x-bosun:
      host: mbp
      probe: exec
      check: lsof -t -- /Users/afc/.fh2/control.sock
      restart:
        minSec: 30
        maxRetries: 5
      process:
        cwd: /Users/afc/work/afc-work/music/expert-sleepers/fh2-config
        # Launch the PREBUILT output, not `spago run` — no compile-at-launch, no
        # PureScript toolchain as a runtime dep. `spago build` once. The PS
        # `output/Main/index.js` is a LIBRARY module (exports `main`, doesn't call
        # it), so it needs a tiny runner that invokes it — fh2-config/run-daemon.mjs
        # (the toolchain-free analog of bosun's cli/run.js). `--daemon` reaches
        # main via argv. (es9/link are prebuilt Rust binaries, purerl-tidal runs
        # the compiled BEAM ebin — fh2 was the only build-at-launch outlier.)
        command: node run-daemon.mjs --daemon
      expose:
        - socket: /Users/afc/.fh2/control.sock

  fh2-drumkit:
    # The FH-2 drum-trigger breakout config, re-applied on rig setup. The FH-2
    # does not persist its MCV config through a powercycle unless saved to flash,
    # so we keep the config in the repo (fh2-config/scripts/apply-drum-breakout.mjs
    # — the source of truth) and re-apply it here, the declarative-config-as-data
    # way (cf the Selene polysignals). It sets one note-filtered trigger MCV per
    # Balistes drum note (bd/sn/cp/hh = 36/38/39/42, ch 10) → FHX-8GT jacks 1-4 →
    # the vpme.de QuadDrum, leaving the FH-2's CV-capable main jacks free.
    #
    # A SETUP member, not a daemon: Bosun is keep-alive-only (no oneshot — a
    # process that exits is relaunched), so the command applies the config then
    # `exec sleep`s to stay RESIDENT (the systemd RemainAfterExit idiom) — Bosun's
    # process probe reads the resident sleep as "up" and never restart-spams the
    # FH-2 with SysEx. depends_on fh2-daemon → applied AFTER the daemon binds its
    # socket (the script retries the connect to cover the daemon's process-probe
    # readiness racing the actual bind), and D-E5-co-restarted (re-applied)
    # whenever the daemon bounces. No port/socket of its own → no expose. To also
    # persist to the FH-2's flash, run the script by hand with --save.
    depends_on:
      - fh2-daemon
    x-bosun:
      host: mbp
      probe: process
      process:
        cwd: /Users/afc/work/afc-work/music/expert-sleepers/fh2-config
        command: sh -c 'node scripts/apply-drum-breakout.mjs; exec sleep 2147483647'

  continuo:
    # Instrument tier: it owns a CoreAudio output and creates the "continuo"
    # virtual CoreMIDI destination, both singletons. Capped because a failure
    # here is usually a plugin that will not load (an AU that needs online auth,
    # a scan that crashed), and a plugin that would not load this second will
    # not load on the two-thousandth attempt either.
    #
    # The AUDITION VOICE (Marginalia #267, music/continuo). A headless JUCE
    # console daemon hosting one AU/VST3 instrument (Piano One) and playing
    # incoming MIDI to CoreAudio, so the Triggerfish instruments — Vetula
    # especially — have a real timbre to be heard through without Ableton.
    # Stage 0 (no deps): it creates the "continuo" virtual CoreMIDI destination
    # + ~/.continuo/control.sock (load/gain/panic/status verbs, clean SIGTERM
    # drain) and waits. A native process like fh2-daemon, so probe: process —
    # the socket is the reachability, not a TCP port. Prebuilt binary (cmake
    # build once); NB load the plugin by FULL PATH — a bare name triggers a
    # destructive full AU scan that crashy AUv3s on this machine can kill (the
    # PianoOne.component path has no spaces, so no quoting needed). Bosun owns it
    # going forward; the Vetula WebMIDI route prefers this "continuo" port when
    # it's live (else the IAC bus).
    #
    # --plugin is REPEATABLE — each is a LAYER, all sounding the same notes. The
    # audition voice is piano + LABS strings: the second layer is Spitfire LABS
    # via the Splice wrapper (AU id AudioUnit:Synths/aumu,Inst,Splc — loads its
    # patch headless, no GUI). Both tokens are space-free so the space-split
    # command is safe. Drop the second --plugin if LABS/Splice ever needs online
    # auth at boot; the DLSMusicDevice (AudioUnit:Synths/aumu,dls ,appl) is a
    # self-contained fallback (but its id HAS a space — quote or use LABS/DLS via
    # the `add` socket verb instead).
    restart: on-failure
    x-bosun:
      host: mbp
      probe: exec
      check: lsof -t -- /Users/afc/.continuo/control.sock
      restart:
        minSec: 30
        maxRetries: 5
      process:
        cwd: /Users/afc/work/afc-work/music/continuo
        command: ./build/continuo_artefacts/continuo --plugin /Library/Audio/Plug-Ins/Components/PianoOne.component --plugin AudioUnit:Synths/aumu,Inst,Splc --gain 0.7
      expose:
        - socket: /Users/afc/.continuo/control.sock
