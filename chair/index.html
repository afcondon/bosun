<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bosun's Chair</title>
  <style>
    :root {
      --ink: #1a1a1a; --muted: #777; --line: #e3e3e3; --bg: #fafafa; --panel: #fff;
      --up: #1a7f37; --down: #9a9a9a; --redirect: #b06a00; --reject: #b3261e; --accent: #1a1a1a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.5 "Helvetica Neue", Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── full-screen app shell ── */
    .app { display: flex; flex-direction: column; height: 100vh; }
    .appnav {
      flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
      height: 46px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; letter-spacing: -0.01em; font-size: 15px; margin-right: 4px; }
    .nav-grp { display: flex; align-items: center; gap: 8px; }
    .nav-spacer { flex: 1 1 auto; }
    .status { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .sel {
      font: inherit; font-size: 12px; padding: 4px 8px; background: var(--panel);
      border: 1px solid var(--line); color: var(--ink); cursor: pointer; border-radius: 4px;
    }
    .btn.xs { padding: 2px 9px; font-size: 12px; border-color: var(--line); color: var(--muted); }
    .btn.xs:hover { background: var(--ink); color: #fff; border-color: var(--ink); }

    .appbody { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .mainpane { flex: 1 1 auto; overflow: hidden; min-width: 0; min-height: 0; position: relative; }
    .mainpane.pad { overflow: auto; padding: 28px 32px 64px; }
    .mainpane.pad > * { max-width: 880px; }
    /* graph fills the pane; the svg is the zoom/drag surface, meta is a thin header */
    .mainpane .graph { display: flex; flex-direction: column; height: 100%; }
    .mainpane .graph .graph-meta { flex: 0 0 auto; padding: 8px 16px; margin: 0; }
    /* the channel rack docked as a horizontal strip along the bottom */
    .dock {
      flex: 0 0 auto; display: flex; align-items: stretch; gap: 14px;
      padding: 10px 16px; overflow-x: auto; overflow-y: hidden;
      border-top: 1px solid var(--line); background: #fbfbfc;
    }
    .dock-h {
      flex: 0 0 auto; align-self: center; writing-mode: vertical-rl; transform: rotate(180deg);
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); font-weight: 600;
    }
    .error {
      margin: 24px 0 0; padding: 12px 16px; background: #fdeceb;
      border-left: 3px solid var(--reject); color: var(--reject); font-size: 14px;
    }
    .muted { color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 16px; margin: 32px 0 8px; }
    .stat {
      flex: 1; background: var(--panel); border: 1px solid var(--line); padding: 16px 18px;
    }
    .stat-val { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
    .stat-lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .sec { margin-top: 40px; }
    .sec h2 {
      font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--accent); margin: 0 0 12px; border-bottom: 2px solid var(--ink); padding-bottom: 8px;
    }
    .sec h2 .count { color: var(--muted); font-weight: 400; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left; font-weight: 500; color: var(--muted); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line);
    }
    td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .dot { font-size: 13px; font-weight: 500; }
    .dot::before { content: "●"; margin-right: 6px; }
    .dot.up { color: var(--up); }
    .dot.down { color: var(--down); }
    .toolbar { margin-top: 20px; display: flex; align-items: center; gap: 12px; }
    .btn {
      font: inherit; font-size: 13px; padding: 7px 14px; background: var(--panel);
      border: 1px solid var(--ink); color: var(--ink); cursor: pointer; letter-spacing: 0.01em;
    }
    .btn:hover { background: var(--ink); color: #fff; }
    .btn:disabled { opacity: 0.4; cursor: default; }
    .btn.sm { padding: 3px 11px; font-size: 12px; border-color: var(--line); color: var(--muted); }
    .btn.sm:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    .foot { margin-top: 48px; color: var(--muted); font-size: 12px; }

    /* ── top nav (view switch) ── */
    .nav { margin-top: 18px; display: flex; gap: 8px; }
    .btn.active { background: var(--ink); color: #fff; }
    .brand-btn { font: inherit; background: none; border: none; padding: 0; cursor: pointer; }
    .brand-btn:hover { color: var(--accent); text-decoration: underline; }
    .nav-grp { display: inline-flex; align-items: center; gap: 8px; }
    .ctx { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }

    /* ── project picker (landing) ── */
    .picker-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin: 28px 0 2px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
    .picker-h:first-child { margin-top: 4px; }
    .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; margin: 14px 0 8px; }
    .proj-card {
      display: block; text-align: left; font: inherit; cursor: pointer;
      background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line);
      padding: 14px 16px; transition: border-color 0.12s, box-shadow 0.12s;
    }
    .proj-card:hover { border-color: var(--ink); box-shadow: 0 1px 0 var(--line); }
    .proj-card.ctl { border-left-color: var(--up); }
    .proj-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .proj-label { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
    .proj-port { font-size: 11px; font-variant-numeric: tabular-nums; color: var(--up); font-weight: 600; }
    .proj-port.view { color: var(--muted); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; }
    .proj-blurb { color: var(--muted); font-size: 12.5px; margin-top: 6px; line-height: 1.45; }

    /* ── root topology tree (the landing, live from declared state) ── */
    .topo-tree { margin: 14px 0 8px; background: var(--panel); border: 1px solid var(--line); padding: 8px 0; }
    .topo-row { display: flex; align-items: baseline; gap: 10px; padding: 4px 16px 4px 8px;
                font-variant-numeric: tabular-nums; line-height: 1.5; }
    .topo-row.group { cursor: pointer; }
    .topo-row.group:hover { background: #f4f4f5; }
    .topo-row.group .topo-name { font-weight: 700; }
    .topo-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
                background: var(--down); transform: translateY(-1px); }
    .topo-dot.up { background: var(--up); }
    .topo-dot.down { background: var(--reject); }
    .topo-dot.warn { background: var(--redirect); }
    .topo-dot.unknown { background: var(--down); }
    .topo-name { font-size: 13.5px; color: var(--ink); }
    .topo-gport { font-size: 11px; color: var(--up); font-weight: 600; }
    .topo-port { font-size: 11px; color: var(--muted); }
    .topo-stat { margin-left: auto; font-size: 11px; color: var(--muted);
                 text-transform: uppercase; letter-spacing: 0.05em; }

    /* ── serve fleet (lazy-spawn routes on :3997) ── */
    .fleet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                  gap: 6px; margin: 12px 0 8px; }
    .fleet-row { display: flex; align-items: baseline; gap: 8px; text-align: left; font: inherit;
                 padding: 6px 10px; background: var(--panel); border: 1px solid var(--line);
                 cursor: pointer; font-variant-numeric: tabular-nums; transition: border-color 0.12s; }
    .fleet-row:hover { border-color: var(--ink); }
    .fleet-name { font-size: 12.5px; color: var(--ink); overflow: hidden;
                  text-overflow: ellipsis; white-space: nowrap; }
    .fleet-port { margin-left: auto; font-size: 11px; color: var(--muted); }

    /* ── ingestion: source picker ── */
    .picker { margin-top: 28px; background: var(--panel); border: 1px solid var(--line); padding: 18px 20px; }
    .field { display: block; margin-bottom: 12px; }
    .field-lbl { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 5px; }
    .inp {
      width: 100%; font: inherit; font-size: 13px; padding: 8px 10px;
      border: 1px solid var(--line); background: #fcfcfc; color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .inp:focus { outline: none; border-color: var(--ink); }

    /* ── ingestion: the ladder rungs ── */
    .rung { margin-top: 44px; padding-top: 4px; border-top: 3px solid var(--ink); }
    .rung-cap { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; }
    .rung-num { font-size: 22px; font-weight: 700; }
    .rung-title { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
    .rung-gloss { color: var(--muted); font-size: 14px; }
    .rung-misu {
      margin: 6px 0 4px; font-size: 12px; color: var(--accent);
      background: #f1f1ef; border-left: 3px solid var(--down); padding: 7px 12px;
    }

    /* ── source badges + facet pills ── */
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      padding: 2px 8px; border-radius: 2px; text-transform: lowercase;
    }
    .src-compose { background: #e7f0fb; color: #1f5bb5; }
    .src-registry { background: #eef3e7; color: #4a7320; }
    .src-plist, .src-systemd, .src-k8s, .src-overlay { background: #f0eef6; color: #5b4a9a; }
    .mech { font-weight: 600; }
    .detail { font-size: 12px; }
    .pill {
      display: inline-block; font-size: 12px; padding: 1px 8px; border: 1px solid var(--line);
      border-radius: 10px; background: #fcfcfc;
    }

    /* ── validate rung: ok / err panels ── */
    .ok-panel { border-left: 3px solid var(--up); padding: 4px 0 4px 16px; margin-top: 8px; }
    .ok-head { color: var(--up); font-weight: 600; font-size: 14px; margin: 8px 0 0; }
    .err-panel { border-left: 3px solid var(--reject); padding: 4px 0 4px 16px; margin-top: 8px; }
    .err-head { color: var(--reject); font-weight: 600; font-size: 14px; margin: 8px 0 14px; }
    .err-card { background: #fdeceb; border: 1px solid #f3c9c5; padding: 12px 14px; margin-bottom: 12px; }
    .err-kind { font-weight: 700; font-size: 13px; color: var(--reject); }
    .err-detail { font-size: 14px; margin: 3px 0 6px; }
    .rem { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .rem li { margin: 2px 0; }

    /* ── editable aliases (C2) ── */
    .edits { margin-top: 28px; background: #f6f7f8; border: 1px solid var(--line); padding: 14px 16px; }
    .edits-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px; font-size: 12px;
      background: var(--panel); border: 1px solid var(--ink); padding: 3px 6px 3px 10px; border-radius: 2px;
      font-variant-numeric: tabular-nums;
    }
    .chip-x { font: inherit; font-size: 12px; line-height: 1; border: none; background: none; color: var(--muted); cursor: pointer; padding: 0 2px; }
    .chip-x:hover { color: var(--reject); }
    .merge-form { display: flex; align-items: center; gap: 8px; }
    .inp.sm { width: auto; flex: 1; padding: 5px 8px; font-size: 12px; }

    /* ── graph (pillar 3, increment 1) ── */
    .graph-meta { margin-top: 16px; }
    /* fills the remaining pane; the .zoom-group inside is what pans/zooms */
    .graph-svg {
      flex: 1 1 auto; width: 100%; height: 100%; min-height: 0; display: block;
      background: var(--panel); border-top: 1px solid var(--line);
      cursor: grab; touch-action: none;
    }
    .graph-svg:active { cursor: grabbing; }
    .graph-svg text { font-family: inherit; }
    /* brushing: dim the unconnected (never hide), smooth transition. The pivot
       itself is driven per-frame by the Hylograph interpolation engine (nodes
       AND edges re-render from interpolated positions), so no CSS transform
       transition here — only opacity for the brush. */
    .graph-svg .node, .graph-svg .edge, .graph-svg .route { transition: opacity 140ms ease; }
    .graph-svg .node { cursor: pointer; }
    .graph-svg .dim { opacity: 0.13; }
    /* host swimlanes fade in as the nodes glide into them (keyframe, not a
       transition, so it fires when the bands are created on entering host mode) */
    @keyframes laneIn { from { opacity: 0; } to { opacity: 1; } }
    .graph-svg .swimlane { animation: laneIn 480ms ease both; }
    /* live overlay (serve /state): the status dot fades in; a DOWN node's ring
       pulses so a real outage draws the eye without an interaction. */
    .graph-svg .live-dot { animation: laneIn 240ms ease both; }
    @keyframes downPulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
    .graph-svg .live-down-halo { animation: downPulse 1.1s ease-in-out infinite; }
    /* a control op (up/down/restart) is in flight for this node: throb the amber
       dot so "working, please wait" reads at a glance — the ssh docker compose
       teardown is slow and this is the feedback that stops the button-mashing. */
    @keyframes workPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .graph-svg .live-dot.working { animation: workPulse 0.85s ease-in-out infinite; }
    .ro-btn:disabled { opacity: 0.4; cursor: progress; }
    .ro-btn:disabled:hover { background: inherit; color: inherit; border-color: inherit; }

    /* ── ARMED control mode (ChControl) — loud + unmistakable ── */
    /* a pulsing red inset frame on the canvas: you cannot fail to notice that a
       click now starts/stops/reboots a real service. */
    @keyframes armedFrame {
      0%,100% { box-shadow: inset 0 0 0 3px var(--reject); }
      50%     { box-shadow: inset 0 0 0 6px var(--reject); }
    }
    .graph.armed .graph-svg { animation: armedFrame 1.5s ease-in-out infinite; background: #fffdfc; }
    .armed-banner {
      display: inline-block; margin-left: 14px; padding: 3px 11px; border-radius: 4px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #fff;
      background: var(--reject); animation: downPulse 1.5s ease-in-out infinite;
    }
    /* the fill-buttons: brighten on hover, labels never intercept the click */
    .graph-svg .ctrl-btn { cursor: pointer; transition: filter 120ms ease; }
    .graph-svg .ctrl-btn:hover { filter: brightness(1.13); }
    .graph-svg .ctrl-label { pointer-events: none; font-weight: 600; }
    /* the fixed runtime overlay (top-right corner): live status minimap that
       doubles as the single arm-control toggle. Floats above everything. */
    .runtime-overlay {
      position: fixed; top: 12px; right: 16px; z-index: 60; width: 184px;
      display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 9px 11px 7px;
      appearance: none; background: var(--panel); border: 1px solid var(--line);
      border-radius: 9px; box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      cursor: pointer; text-align: left; font: inherit;
      transition: box-shadow 140ms ease, border-color 140ms ease;
    }
    .runtime-overlay:hover { border-color: #c9c9c9; box-shadow: 0 6px 20px rgba(0,0,0,0.14); }
    .ro-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .ro-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--ink);
    }
    .ro-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .ro-svg { display: block; width: 100%; height: auto; background: #fcfcfd; border-radius: 5px; }
    .ro-hint { font-size: 10px; color: var(--muted); text-align: center; letter-spacing: 0.03em; }
    /* armed: a pulsing red frame in the corner (the dots are greyed in PS) — the
       same loud signal as the main-map frame, parked where you armed it. */
    @keyframes armedCorner {
      0%,100% { box-shadow: 0 0 0 2px #f7dad7, 0 6px 20px rgba(179,38,30,0.22); }
      50%     { box-shadow: 0 0 0 4px #f0b6b0, 0 6px 20px rgba(179,38,30,0.30); }
    }
    .runtime-overlay.armed {
      border-color: var(--reject); animation: armedCorner 1.5s ease-in-out infinite;
    }
    .runtime-overlay.armed .ro-title, .runtime-overlay.armed .ro-hint { color: var(--reject); }
    /* when the panel is a div (armed, or a non-supervise status-only group) the
       whole-panel click no longer arms, so don't imply it's clickable. */
    div.runtime-overlay { cursor: default; }
    div.runtime-overlay:hover { border-color: var(--line); box-shadow: 0 4px 16px rgba(0,0,0,0.10); }
    div.runtime-overlay.armed:hover { border-color: var(--reject); }
    /* armed whole-group controls (tasks 1–5): up = confirmatory green, down = the
       alarm red (stop means stop — auto-restart suspended). */
    .ro-controls { display: flex; gap: 6px; }
    .ro-btn {
      flex: 1; font: inherit; font-size: 11px; font-weight: 600; padding: 5px 0;
      border-radius: 5px; border: 1px solid; cursor: pointer; letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }
    .ro-btn.up { color: #1a7f37; border-color: #9bd3ad; background: #f1faf3; }
    .ro-btn.up:hover { background: #1a7f37; color: #fff; border-color: #1a7f37; }
    .ro-btn.down { color: var(--reject); border-color: #e6b3ae; background: #fdf3f2; }
    .ro-btn.down:hover { background: var(--reject); color: #fff; border-color: var(--reject); }
    .ro-disarm {
      font: inherit; font-size: 10px; color: var(--reject); background: none; border: none;
      cursor: pointer; text-align: center; letter-spacing: 0.03em; padding: 0;
    }
    .ro-disarm:hover { text-decoration: underline; }
    .graph-legend { display: flex; gap: 40px; flex-wrap: wrap; margin-top: 18px; font-size: 12px; color: var(--muted); }
    .leg-grp { display: flex; flex-direction: column; gap: 5px; }
    .leg-h {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
      color: var(--ink); font-weight: 600; margin-bottom: 3px;
    }
    .leg { display: inline-flex; gap: 10px; align-items: baseline; }
    .leg-sym { font-family: ui-monospace, Menlo, Monaco, monospace; min-width: 26px; color: var(--ink); }

    /* the small-multiples rack: dot/edge thumbnails that toggle channels and
       double as the legend. Off thumbnails are dimmed; on thumbnails carry an
       accent underline so the enabled set is readable at a glance. */
    .graph-rack {
      display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px;
      padding-top: 16px; border-top: 1px solid var(--rule, #e6e6e6);
    }
    /* docked along the bottom: one non-wrapping row, scrolls sideways */
    .dock .graph-rack { flex-direction: row; flex-wrap: nowrap; gap: 12px; margin: 0; padding: 0; border-top: none; }
    .dock .sm-thumb { flex: 0 0 auto; }
    .sm-thumb {
      display: flex; flex-direction: column; align-items: stretch; gap: 4px;
      padding: 6px 6px 4px; background: #fff; cursor: pointer;
      border: 1px solid #e3e3e3; border-radius: 7px;
      transition: opacity 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
      opacity: 0.4; filter: saturate(0.6);
    }
    .sm-thumb:hover { border-color: #c9c9c9; }
    .sm-thumb.on {
      opacity: 1; filter: none; border-color: #cfd6e0;
      box-shadow: 0 1px 0 #1a1a1a inset, 0 0 0 1px #f4f6f9;
    }
    .sm-svg { display: block; background: #fcfcfd; border-radius: 4px; }
    .sm-cap {
      font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); text-align: center;
    }
    .sm-thumb.on .sm-cap { color: var(--ink); font-weight: 600; }
  </style>
</head>
<body>
  <script src="./app.js"></script>
</body>
</html>
