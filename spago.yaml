# Bosun workspace root.
#
# Six packages, mirroring (and extending) signal-box's core/harness split:
#   core/         pure: atoms, types, reconcile/validate/plan/apply, serve admission, Report, DeployError
#   adapters/     pure ingest per source (compose, registry, start-command)
#   cli/          the `bosun` entrypoint + the Effect edges (observe, apply, the resident serve shim) + report
#   test/         scenario corpus as tests + PBT generators / injectors / shrinkers
#   conformance/  I/O-free Mains the backend-go column transpiles + runs (the cross-backend gate)
#   chair/        Bosun's Chair — the Halogen front-end
#
# Develop and test on the node backend; purescript-go is a separate
# conformance column (the backend-go MVP gate). See README.md for current
# status and docs/BUILD-PLAN.md for the phased rationale.
workspace:
  packageSet:
    registry: 77.5.0
  extraPackages: {}
