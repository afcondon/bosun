# The conformance harness. Programs that run the pure pipeline over fixtures
# and print what it says, with no file, YAML or argv I/O of their own. Each is
# compiled for node and, by purerl, for the BEAM; `beam/conformance.sh` runs
# both and the output must be byte-identical. (It began as the purescript-go
# harness, BUILD-PLAN Phase 4; the Go column was removed 2026-11-17.)
package:
  name: bosun-conformance
  description: "conformance harness: the pure pipeline over fixtures, printed, on node and the BEAM."
  dependencies:
    - prelude
    - effect
    - console
    - maybe
    - ordered-collections
    - partial
    - strings
    - arrays
    - validation
    - either
    - argonaut-core
    - foreign-object
    - bosun-core
    - bosun-adapters
    - bosun-protocol
    - codec-argonaut
    - bosun-cli
    - glassbox
  run:
    main: Bosun.Conformance.Main
