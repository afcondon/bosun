<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink:    #1b1b1b;
    --bg:     #ffffff;
    --muted:  #6c6c6c;
    --faint:  #8e8e8e;
    --rule:   #e6e6e3;
    --accent: #c0362c;          /* Swiss red, used sparingly */
    --accent-soft: #f7ece9;
    --code-bg: #f6f6f3;
    --sidebar: 300px;
    --measure: 50rem;           /* reading column */
    --wide:    62rem;           /* tables may run wider */
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: "Inter", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.62;
    font-feature-settings: "kern", "liga", "tnum";
    -webkit-font-smoothing: antialiased;
  }

  /* ── Sidebar table of contents ─────────────────────────────── */
  #TOC {
    position: fixed;
    top: 0; left: 0;
    width: var(--sidebar);
    height: 100vh;
    overflow-y: auto;
    padding: 2.4rem 1.6rem 3rem 2rem;
    border-right: 1px solid var(--rule);
    background: #fbfbfa;
    font-size: 0.82rem;
    line-height: 1.45;
  }
  #TOC::before {
    content: "BOSUN";
    display: block;
    font-weight: 700;
    letter-spacing: 0.18em;
    font-size: 0.72rem;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }
  #TOC::after {
    content: "Design Dossier";
    display: block;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--faint);
    margin: -0.7rem 0 1.6rem;
  }
  #TOC ul { list-style: none; margin: 0; padding: 0; }
  #TOC > ul > li { margin: 0.15rem 0; }
  #TOC ul ul { padding-left: 0.85rem; margin: 0.1rem 0 0.5rem; }
  #TOC li { margin: 0.08rem 0; }
  #TOC a {
    color: var(--muted);
    text-decoration: none;
    display: block;
    padding: 1px 0;
    border-left: 2px solid transparent;
    padding-left: 0.55rem;
    margin-left: -0.55rem;
    transition: color .12s, border-color .12s;
  }
  #TOC > ul > li > a { color: var(--ink); font-weight: 600; }
  #TOC a:hover { color: var(--accent); }
  #TOC a.active { color: var(--accent); border-left-color: var(--accent); }

  /* ── Content column ────────────────────────────────────────── */
  body > *:not(#TOC) {
    margin-left: calc(var(--sidebar) + 3.5rem);
    margin-right: 2rem;
    max-width: var(--measure);
  }
  body > table,
  body > div.sourceCode,
  body > pre { max-width: var(--wide); }

  #title-block-header { margin-top: 3.2rem; }

  /* ── Typography ────────────────────────────────────────────── */
  h1, h2, h3, h4 { line-height: 1.2; font-weight: 700; }
  h1 {
    font-size: 2.0rem;
    margin: 3.6rem 0 1.1rem;
    padding-top: 2.4rem;
    border-top: 2px solid var(--ink);
    letter-spacing: -0.01em;
  }
  body > h1:first-of-type { border-top: none; padding-top: 0; margin-top: 1rem; }
  h2 { font-size: 1.32rem; margin: 2.6rem 0 0.8rem; letter-spacing: -0.005em; }
  h3 { font-size: 1.06rem; margin: 1.9rem 0 0.5rem; }
  h4 { font-size: 0.95rem; margin: 1.4rem 0 0.4rem; color: var(--muted); }
  p { margin: 0.7rem 0; }
  strong { font-weight: 650; }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  a:hover { border-bottom-color: var(--accent); }
  hr { border: none; border-top: 1px solid var(--rule); margin: 2.4rem 0; }

  ul, ol { margin: 0.6rem 0; padding-left: 1.3rem; }
  li { margin: 0.25rem 0; }
  li > ul, li > ol { margin: 0.2rem 0; }

  /* ── Code ──────────────────────────────────────────────────── */
  code {
    font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.85em;
    background: var(--code-bg);
    padding: 0.1em 0.35em;
    border-radius: 3px;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--rule);
    border-radius: 5px;
    padding: 1rem 1.1rem;
    overflow-x: auto;
    line-height: 1.5;
  }
  pre code { background: none; padding: 0; font-size: 0.8rem; }

  /* ── Tables ────────────────────────────────────────────────── */
  table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; font-size: 0.88rem; }
  th, td { text-align: left; padding: 0.5rem 0.8rem; vertical-align: top; border-bottom: 1px solid var(--rule); }
  thead th { border-bottom: 2px solid var(--ink); font-weight: 650; }
  tbody tr:hover { background: #fbfbf9; }

  /* ── Blockquotes / callouts ────────────────────────────────── */
  blockquote {
    margin: 1.2rem 0;
    padding: 0.6rem 1.1rem;
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    color: #2a2a2a;
    border-radius: 0 4px 4px 0;
  }
  blockquote p:first-child { margin-top: 0; }
  blockquote p:last-child { margin-bottom: 0; }

  /* ── Cover ─────────────────────────────────────────────────── */
  .cover-tag { font-size: 1.05rem; color: var(--muted); font-style: italic; }
  .cover-meta { font-size: 0.84rem; color: var(--faint); margin-top: 1.4rem; }

  /* ── Responsive ────────────────────────────────────────────── */
  @media (max-width: 950px) {
    #TOC {
      position: static; width: auto; height: auto;
      border-right: none; border-bottom: 1px solid var(--rule);
    }
    body > *:not(#TOC) { margin-left: 1.4rem; margin-right: 1.4rem; max-width: none; }
  }

  /* ── Print ─────────────────────────────────────────────────── */
  @media print {
    #TOC { display: none; }
    body > *:not(#TOC) { margin: 0; max-width: none; }
    h1 { page-break-before: always; }
    body > h1:first-of-type { page-break-before: avoid; }
    pre, table, blockquote { page-break-inside: avoid; }
    a { color: var(--ink); border: none; }
  }
</style>
